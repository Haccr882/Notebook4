<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — Notebook</title>
<meta name="description" content="Contact Us for Notebook, the free AI study notes generator.">
<style>
body{font-family:Georgia,'Times New Roman',serif;background:#FBF7EC;color:#23301F;margin:0;line-height:1.65}
header{background:#2E241A;color:#E9DCC4;padding:0.9rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
header a{color:#E9DCC4;text-decoration:none;font-weight:bold}
main{max-width:720px;margin:0 auto;padding:1.4rem 1.2rem 3rem}
h1{font-size:1.6rem;margin-top:0} h2{font-size:1.1rem;margin-top:1.6rem;color:#8a5522}
footer{text-align:center;font-size:0.8rem;padding:1.4rem;opacity:.85} footer a{color:inherit}
input,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:0.6rem;margin:0.35rem 0;border:1px solid #DED4B8;border-radius:8px}
button{background:#B8722E;color:#fff;border:none;cursor:pointer}
</style></head><body>
<header><a href="../index.html">📓 Notebook</a><a href="../index.html">← Back to app</a></header>
<main>
<h1>Contact Us</h1>

<p>Found a bug, have a suggestion, or need help? Send us a message — we read everything.</p>
<textarea id="msg" rows="5" placeholder="Your message"></textarea>
<input id="contact" type="text" placeholder="Your email or phone (optional, if you want a reply)">
<button id="send">Send message</button>
<p id="status"></p>
<p>You can also email us at <b>YOUR-EMAIL@example.com</b> <i>(replace with your real address before publishing)</i>.</p>
<script>
document.getElementById("send").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const message = document.getElementById("msg").value.trim();
  if(!message){ status.textContent = "Please write a message first."; return; }
  status.textContent = "Sending…";
  try{
    const res = await fetch("/api/feedback", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ action:"submit", message, contact: document.getElementById("contact").value.trim() }) });
    if(!res.ok) throw new Error();
    status.textContent = "Thanks! Your message was sent.";
    document.getElementById("msg").value = "";
  }catch(e){ status.textContent = "Couldn't send right now — please email us instead."; }
});
</script>
</main>
<footer><a href="about.html">About</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms &amp; Conditions</a> · <a href="contact.html">Contact</a></footer>
</body></html>
